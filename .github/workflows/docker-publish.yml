name: Build & Publish Frontend Image

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: inoovaweb/crm-oka

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extrair metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_SUPABASE_URL=https://osheoeeigahkwsrzfjdw.supabase.co
            VITE_SUPABASE_PUBLISHABLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9zaGVvZWVpZ2Foa3dzcnpmamR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0OTI1OTUsImV4cCI6MjA5MzA2ODU5NX0.X9dKzMBjZEkqTvrI2kDRVhBHeDqQAjUraD0ygC0hGeI
            VITE_BACKEND_URL=https://crm.hinodeimoveis.com.br/backend
